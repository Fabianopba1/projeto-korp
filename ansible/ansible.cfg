[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# O callback 'yaml' vive na colecao community.general, que nao esta no
# requirements.yml: com ansible-core puro o playbook aborta antes da
# primeira task. O callback default aceita result_format=yaml desde o
# core 2.13 e entrega a mesma saida sem a dependencia extra.
stdout_callback      = default
# Mostra a duracao de cada task: ajuda a justificar escolhas na entrevista.
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 10
display_skipped_hosts = False

[callback_default]
result_format = yaml

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
