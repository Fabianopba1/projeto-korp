---
# Endereco usado nas requisicoes. uri e wait_for rodam no host alvo, entao
# localhost aqui e o proprio korp-devops.
korp_validate_host: localhost

# Endereco exibido nos links do resumo final.
korp_display_host: "{{ ansible_host | default(inventory_hostname) }}"

# Precisa ser > 1s: o RFC3339 tem precisao de segundo.
korp_intervalo_teste_dinamico: 2

korp_grafana_user: admin
korp_grafana_password: admin
