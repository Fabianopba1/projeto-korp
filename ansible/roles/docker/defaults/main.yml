---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_apt_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# SDK Python exigido pelos modulos community.docker. Se o pacote da distro
# for mais antigo que o minimo, o playbook instala via pip.
docker_sdk_package: python3-docker
docker_sdk_min_version: "7.0.0"

# Usuario adicionado ao grupo docker (quem chamou o sudo, ou o executor).
docker_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id, true) }}"
