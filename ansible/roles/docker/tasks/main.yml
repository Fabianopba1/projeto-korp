---
# Instala o Docker CE do repositorio oficial (traz o plugin compose v2).

- name: Falhar cedo se a distribuicao nao for suportada
  ansible.builtin.assert:
    that: ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Esta role suporta apenas familias Debian (Ubuntu/Debian) e RedHat
      (Rocky/Alma/CentOS/Fedora). Detectado: {{ ansible_os_family }}.
    success_msg: "Distribuicao suportada: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Bloco de instalacao para Debian/Ubuntu
  when: ansible_os_family == 'Debian'
  block:

    - name: Instalar pre-requisitos do apt
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - python3-pip
          - python3-debian   # exigido por deb822_repository
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Criar diretorio de chaves do apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    # deb822_repository substitui o apt_repository deprecado; exige
    # ansible-core >= 2.15. A chave fica restrita a este repositorio.
    - name: Adicionar o repositorio oficial do Docker (formato deb822)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: ["{{ docker_apt_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    - name: Instalar Docker Engine e plugins
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

- name: Bloco de instalacao para RedHat
  when: ansible_os_family == 'RedHat'
  block:

    - name: Instalar dnf-plugins-core
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - python3-pip
        state: present

    - name: Adicionar o repositorio oficial do Docker
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: true

    - name: Instalar Docker Engine e plugins
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present

- name: Configurar o daemon (rotacao de log e driver de storage)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true
      }
  notify: Reiniciar docker

# Handlers rodam no fim do play. Sem o flush, o restart do daemon
# aconteceria depois de a stack subir e a validacao passar.
- name: Aplicar a configuracao do daemon antes de subir containers
  ansible.builtin.meta: flush_handlers

# Os modulos community.docker usam o SDK Python, nao a CLI.
- name: Instalar o SDK Python do Docker (via gerenciador de pacotes)
  ansible.builtin.package:
    name: "{{ docker_sdk_package }}"
    state: present
  register: sdk_pkg
  failed_when: false

- name: Descobrir a versao do SDK efetivamente instalada
  ansible.builtin.command: >-
    {{ ansible_python_interpreter | default('/usr/bin/python3') }}
    -c "import docker; print(docker.__version__)"
  register: sdk_versao
  changed_when: false
  failed_when: false

- name: Exibir o diagnostico do SDK
  ansible.builtin.debug:
    msg: >-
      SDK Docker: {{ sdk_versao.stdout | default('ausente') }}
      (minimo exigido: {{ docker_sdk_min_version }})

# --break-system-packages: Debian 12+ e Ubuntu 24.04 marcam o Python do
# sistema como externally managed (PEP 668).
- name: Instalar ou atualizar o SDK Python do Docker via pip
  ansible.builtin.pip:
    name:
      - "docker>={{ docker_sdk_min_version }}"
      - requests>=2.31.0
    state: present
    extra_args: --break-system-packages
  when: >-
    sdk_versao.rc != 0
    or sdk_versao.stdout is not version(docker_sdk_min_version, '>=')

- name: Garantir que o servico Docker esteja iniciado e habilitado no boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

# Vale a partir da proxima sessao de login; o playbook segue com become.
- name: Adicionar o usuario ao grupo docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  when: docker_user | length > 0

- name: Coletar a versao instalada do Docker
  ansible.builtin.command: docker --version
  register: docker_version_out
  changed_when: false

- name: Coletar a versao do plugin Compose
  ansible.builtin.command: docker compose version
  register: compose_version_out
  changed_when: false

- name: Exibir as versoes instaladas
  ansible.builtin.debug:
    msg:
      - "{{ docker_version_out.stdout }}"
      - "{{ compose_version_out.stdout }}"
