# O Docker e instalado pelo playbook; o host so precisa de Python 3,
# SSH por chave e sudo. Para provisionar a propria maquina:
#   localhost ansible_connection=local

[korp]
korp-devops ansible_host=192.168.0.161 ansible_user=korp ansible_ssh_private_key_file=~/.ssh/id_ed25519_korp

[korp:vars]
ansible_python_interpreter=/usr/bin/python3
