# =============================================================================
# Inventario - host alvo do provisionamento
#
# O Docker e instalado pelo playbook; a VM so precisa de Python 3,
# acesso SSH por chave e sudo.
# =============================================================================

[korp]
korp-devops ansible_host=192.168.0.161 ansible_user=korp ansible_ssh_private_key_file=~/.ssh/id_ed25519_korp

[korp:vars]
ansible_python_interpreter=/usr/bin/python3
