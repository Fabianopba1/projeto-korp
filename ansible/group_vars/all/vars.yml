---
# Sobrescreva com -e, ex.: ansible-playbook site.yml -e korp_app_version=2.0.0

# Raiz do repositorio no control node (playbook_dir e .../ansible).
korp_repo_dir: "{{ playbook_dir }}/.."

# Onde a stack fica no host alvo.
korp_project_dir: /opt/projeto-korp

korp_network_name: korp-net
korp_app_version: "1.0.0"
korp_log_level: info

korp_grafana_user: admin
# O valor real vive em vault.yml, criptografado. A indirecao com prefixo
# vault_ permite localizar onde o segredo e usado sem descriptografar nada.
korp_grafana_password: "{{ vault_korp_grafana_password }}"
