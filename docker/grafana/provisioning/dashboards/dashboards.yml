# =============================================================================
# Provider de dashboards: manda o Grafana varrer um diretorio em busca
# de arquivos .json e carrega-los automaticamente.
# =============================================================================
apiVersion: 1

providers:
  - name: projeto-korp
    orgId: 1
    folder: Projeto Korp
    type: file
    disableDeletion: false
    # Reescaneia o diretorio periodicamente: editar o JSON e recarregar
    # a pagina ja reflete a mudanca, sem reiniciar o container.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
