apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid fixo: o JSON do dashboard referencia este valor.
    uid: prometheus-korp
    access: proxy
    url: http://prometheus:9090
    orgId: 1
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
