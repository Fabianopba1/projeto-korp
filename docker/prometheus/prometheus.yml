global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: projeto-korp
    ambiente: desenvolvimento

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # Fala direto com o container na 8080, sem passar pelo nginx. Por isso
  # /metrics pode ficar bloqueado na borda.
  - job_name: http-server-projeto-korp
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - http-server-projeto-korp:8080
        labels:
          servico: http-server-projeto-korp
          camada: aplicacao
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: http-server-projeto-korp:8080

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          camada: monitoramento
