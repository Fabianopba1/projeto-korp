# Proxy reverso para o http-server-projeto-korp. Incluido pelo nginx.conf
# padrao da imagem a partir de /etc/nginx/conf.d/.

upstream korp_backend {
    # Nome do servico no compose, resolvido pelo DNS interno do Docker.
    server http-server-projeto-korp:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=korp_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/korp-access.log;
    error_log  /var/log/nginx/korp-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # O Prometheus coleta direto na 8080; nao ha motivo para expor /metrics.
    location = /metrics {
        deny all;
        return 403;
    }

    # Respondido localmente, usado pelo healthcheck do compose. default_type
    # em vez de add_header: com "return" o nginx ja emite um Content-Type,
    # e add_header aqui tambem cancelaria a heranca dos headers acima.
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"nginx"}';
    }

    location / {
        limit_req zone=korp_limit burst=20 nodelay;

        # Sem barra final: /projeto-korp chega como /projeto-korp no backend.
        proxy_pass http://korp_backend;

        # Exigidos pelo keepalive do upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
