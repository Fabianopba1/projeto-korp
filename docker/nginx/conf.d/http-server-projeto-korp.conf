# =============================================================================
# Proxy reverso para o servico http-server-projeto-korp
# Montado em /etc/nginx/conf.d/ (incluido pelo nginx.conf padrao da imagem)
# =============================================================================

upstream korp_backend {
    # "http-server-projeto-korp" e o nome do servico no compose. O DNS
    # embutido do Docker (127.0.0.11) resolve esse nome para o IP do
    # container dentro da rede bridge korp-net.
    server http-server-projeto-korp:8080 max_fails=3 fail_timeout=10s;

    # Mantem conexoes abertas com o backend em vez de abrir/fechar TCP a
    # cada requisicao. Exige HTTP/1.1 e Connection "" no location.
    keepalive 32;
}

# Zona de rate limiting: 10 req/s por IP, com estado compartilhado de 10MB.
limit_req_zone $binary_remote_addr zone=korp_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Nao revela a versao do NGINX no header Server e nas paginas de erro.
    server_tokens off;

    access_log /var/log/nginx/korp-access.log;
    error_log  /var/log/nginx/korp-error.log warn;

    # Headers de seguranca basicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # -------------------------------------------------------------------------
    # /metrics fica bloqueado na borda.
    #
    # O Prometheus roda dentro da rede korp-net e acessa o container
    # diretamente na porta 8080, sem passar pelo NGINX. Entao nao ha
    # motivo para expor as metricas na internet: elas revelam volume de
    # trafego, rotas internas e versao do binario.
    # -------------------------------------------------------------------------
    location = /metrics {
        deny all;
        return 403;
    }

    # Endpoint de saude do proprio NGINX, respondido localmente sem
    # tocar no backend. Util para o healthcheck do compose.
    location = /nginx-health {
        access_log off;
        # default_type, e nao add_header: com "return" o nginx ja emite um
        # Content-Type a partir de default_type, e add_header apenas
        # acrescentaria um segundo. Um add_header aqui tambem cancelaria a
        # heranca dos headers de seguranca declarados no bloco server.
        default_type application/json;
        return 200 '{"status":"ok","component":"nginx"}';
    }

    # -------------------------------------------------------------------------
    # Requisito do desafio: encaminhar http://localhost:80 para a
    # aplicacao na porta 8080.
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=korp_limit burst=20 nodelay;

        # Sem barra no final do proxy_pass o URI original e preservado:
        # /projeto-korp chega como /projeto-korp no backend.
        proxy_pass http://korp_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sem esses headers a aplicacao so enxergaria o IP interno do
        # container do NGINX como origem de todo o trafego.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Tenta o proximo servidor do upstream em caso de falha
        # (relevante quando houver mais de uma replica).
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
