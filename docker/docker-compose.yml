# Stack do desafio: nginx (:80) -> app (:8080) <- prometheus (:9090) <- grafana (:3000)
#
# Healthchecks usam 127.0.0.1 e nao localhost: dentro do container localhost
# tambem resolve para ::1, e o nginx com "listen 80" so escuta em IPv4.

name: projeto-korp

# A rede e criada antes, pelo Ansible ou por `docker network create`.
networks:
  korp-net:
    external: true
    name: ${KORP_NETWORK:-korp-net}

volumes:
  prometheus-data:
  grafana-data:

services:

  http-server-projeto-korp:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${APP_COMMIT:-local}
    image: http-server-projeto-korp:${APP_VERSION:-1.0.0}
    container_name: http-server-projeto-korp
    restart: unless-stopped

    networks:
      - korp-net

    # Sem "ports": a aplicacao so e alcancavel de dentro da rede korp-net.

    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: UTC

    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-projeto-korp
    restart: unless-stopped

    networks:
      - korp-net

    ports:
      - "80:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    # O nginx resolve o upstream na inicializacao; se subir antes da app
    # existir falha com "host not found in upstream".
    depends_on:
      http-server-projeto-korp:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus-projeto-korp
    restart: unless-stopped

    networks:
      - korp-net

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-projeto-korp
    restart: unless-stopped

    networks:
      - korp-net

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: >-
        /etc/grafana/provisioning/dashboards/http-server-projeto-korp-dashboard.json

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
